<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Cache Monitor · 81.tmp</title>
<style>
body { background:#000; color:#0f0; font-family:monospace; padding:20px; }
pre { background:#111; padding:20px; border-left:3px solid #6cf; }
</style>
</head>
<body>

<h1>81.tmp · LIVE Cache Monitor</h1>
<pre id="out">Lade…</pre>

<script type="module">
import { TMP_GLOBAL } from "./tmp.global.js";

async function update(){
  await TMP_GLOBAL.loadAll();
  document.getElementById("out").innerText =
    JSON.stringify(TMP_GLOBAL.export(), null, 2);
}

setInterval(update, 1000);
update();
</script>

</body>
</html>
