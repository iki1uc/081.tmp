<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>ULTRA‑PLATINE · iki1uc</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body { background:#000; color:#0f0; font-family:monospace; padding:40px; }
h1 { color:#0f0; letter-spacing:4px; margin-bottom:30px; }
.block { background:#111; border:1px solid #333; padding:25px; margin-bottom:30px; border-radius:8px; }
.title { font-size:22px; color:#6cf; margin-bottom:10px; }
pre { background:#000; border-left:3px solid #6cf; padding:15px; margin-top:10px; white-space:pre-wrap; }
button { padding:10px 20px; background:#6cf; border:none; cursor:pointer; margin-top:10px; }
button:hover { background:#9ef; }
</style>

<script type="module">
import { ELECTRO_PLATINE } from "./electro-platine.js";
import { TMP_GLOBAL } from "./tmp.global.js";
import { OWNER_AVATAR } from "./owner-avatar.js";
import { LIVE_BRIDGE_CONNECT } from "../LIVE-BRIDGE/live-core-lage.js";
import { WLOCH } from "../WLOCH/WLOCH.js";
import { GATE } from "./GATE.js";
import { EXPORT_OUTPUT } from "./EXPORT.js";

window.addEventListener("load", async () => {

  /* -----------------------------------------
     1. LIVE‑BRIDGE Pulse aktivieren
  ----------------------------------------- */
  LIVE_BRIDGE_CONNECT();

  /* -----------------------------------------
     2. 81.tmp globalen Cache laden
  ----------------------------------------- */
  await TMP_GLOBAL.loadAll();
  document.getElementById("cacheOut").innerText =
    JSON.stringify(TMP_GLOBAL.export(), null, 2);

  /* -----------------------------------------
     3. Owner‑Avatar Kernel starten
  ----------------------------------------- */
  await OWNER_AVATAR.init();
  document.getElementById("avatarOut").innerText =
    JSON.stringify(OWNER_AVATAR.cache, null, 2);

  /* -----------------------------------------
     4. GATE Achsen visualisieren
  ----------------------------------------- */
  const axis = GATE.axis();
  document.getElementById("gateOut").innerText =
    JSON.stringify(axis, null, 2);

  /* -----------------------------------------
     5. WLOCH Stabilisation anwenden
  ----------------------------------------- */
  const stable = WLOCH.stabilise({ axis });
  document.getElementById("wlochOut").innerText =
    JSON.stringify(stable, null, 2);

  /* -----------------------------------------
     6. EXPORT Output erzeugen
  ----------------------------------------- */
  const out = EXPORT_OUTPUT();
  document.getElementById("exportOut").innerText =
    JSON.stringify(out, null, 2);

  /* -----------------------------------------
     7. Elektro‑Platine Gesamtstatus
  ----------------------------------------- */
  const platine = await ELECTRO_PLATINE();
  document.getElementById("platineOut").innerText =
    JSON.stringify(platine, null, 2);
});
</script>

</head>
<body>

<h1>ULTRA‑PLATINE · iki1uc</h1>

<div class="block">
  <div class="title">81.tmp – Globaler Cache</div>
  <pre id="cacheOut">Lade Cache…</pre>
</div>

<div class="block">
  <div class="title">Owner‑Avatar – Kernel</div>
  <pre id="avatarOut">Initialisiere Kernel…</pre>
</div>

<div class="block">
  <div class="title">GATE – Achsen</div>
  <pre id="gateOut">Lade Achsen…</pre>
</div>

<div class="block">
  <div class="title">WLOCH – Stabilisation</div>
  <pre id="wlochOut">Stabilisiere…</pre>
</div>

<div class="block">
  <div class="title">EXPORT – Output</div>
  <pre id="exportOut">Erzeuge Output…</pre>
</div>

<div class="block">
  <div class="title">ELEKTRO‑PLATINE – Gesamtstatus</div>
  <pre id="platineOut">Starte System…</pre>
</div>

</body>
</html>
