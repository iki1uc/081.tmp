<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>iki1uc · PLATINE</title>
<style>
body { background:#000; margin:0; overflow:hidden; }
canvas { display:block; }
</style>
</head>
<body>
<canvas id="board"></canvas>

<script>
const c = document.getElementById("board");
const ctx = c.getContext("2d");
c.width = window.innerWidth;
c.height = window.innerHeight;

const modules = [
  { name:"81.tmp", x:200, y:200, color:"#0f0" },
  { name:"LIVE-BRIDGE", x:600, y:150, color:"#6cf" },
  { name:"Owner-Avatar", x:900, y:300, color:"#f0f" },
  { name:"GATE", x:400, y:400, color:"#ff0" },
  { name:"EXPORT", x:800, y:500, color:"#f60" },
  { name:"WLOCH", x:300, y:550, color:"#09f" }
];

function drawChip(m){
  ctx.fillStyle = m.color;
  ctx.fillRect(m.x-60, m.y-30, 120, 60);
  ctx.fillStyle="#000";
  ctx.font="16px monospace";
  ctx.fillText(m.name, m.x-50, m.y+5);
}

function drawWire(a,b){
  ctx.strokeStyle="#0f0";
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(a.x, a.y);
  ctx.lineTo(b.x, b.y);
  ctx.stroke();
}

function animatePulse(a,b,t){
  const x = a.x + (b.x - a.x) * t;
  const y = a.y + (b.y - a.y) * t;
  ctx.fillStyle="#fff";
  ctx.beginPath();
  ctx.arc(x,y,5,0,Math.PI*2);
  ctx.fill();
}

let t=0;
function loop(){
  ctx.clearRect(0,0,c.width,c.height);

  modules.forEach(drawChip);

  drawWire(modules[1], modules[0]); // LIVE-BRIDGE → 81.tmp
  drawWire(modules[0], modules[2]); // 81.tmp → Owner-Avatar
  drawWire(modules[0], modules[3]); // 81.tmp → GATE
  drawWire(modules[3], modules[5]); // GATE → WLOCH
  drawWire(modules[5], modules[4]); // WLOCH → EXPORT

  animatePulse(modules[1], modules[0], t);
  animatePulse(modules[0], modules[2], t);
  animatePulse(modules[0], modules[3], t);
  animatePulse(modules[3], modules[5], t);
  animatePulse(modules[5], modules[4], t);

  t += 0.01;
  if(t>1) t=0;

  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
