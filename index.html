<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>81.tmp · iki1uc</title>

<style>
body { background:#000; color:#0f0; font-family:Consolas; padding:20px; }
h1 { color:#ff00ff; text-shadow:0 0 10px #ff00ff; }

/* Grundblock */
.block {
    background:#111;
    padding:15px;
    border-left:4px solid #ff00ff;
    margin-bottom:20px;
    cursor:pointer;

    /* Slide-In */
    position: relative;
    left: -40px;
    opacity: 0;
    transition: all 0.6s ease;
}
.block.active {
    left: 0;
    opacity: 1;
}

/* Flip-Flop */
.block.flip {
    transform: rotateY(180deg);
    transition: transform 0.6s ease;
    transform-style: preserve-3d;
}

/* ASCII Rotation */
pre {
    background:#000;
    padding:12px;
    border-left:3px solid #00e0ff;
    display:inline-block;
    transition: transform 0.8s ease;
}
pre.rotate {
    transform: rotateX(180deg);
}
</style>

<script type="module" src="../VECTOR/VECTOR.81.js"></script>
<script type="module" src="../SLIDE/full.js"></script>
<script type="module" src="../SEND/SEND.core.js"></script>
<script type="module" src="../MOVE/MOVE.core.js"></script>
<script type="module" src="./tmp.hdf.resolver.js"></script>

</head>

<body>

<h1>81.tmp · Daten-Pool</h1>

<!-- 81.room -->
<div class="block" id="block81" onclick="flipFlop('block81'); asciiFlip('room81');">
    <h2>81.room</h2>
    <pre id="room81"></pre>
</div>

<!-- 9.room -->
<div class="block" id="block9" onclick="flipFlop('block9'); asciiFlip('room9');">
    <h2>9.room</h2>
    <pre id="room9"></pre>
</div>

<!-- COMMANDS.room -->
<div class="block" id="blockCommands" onclick="flipFlop('blockCommands'); asciiFlip('commands');">
    <h2>COMMANDS.room</h2>
    <pre id="commands"></pre>
</div>

<!-- one.room -->
<div class="block" id="blockOne" onclick="flipFlop('blockOne'); asciiFlip('one');">
    <h2>one.room</h2>
    <pre id="one"></pre>
</div>

<script>
/* Flip-Flop */
function flipFlop(id) {
    document.getElementById(id).classList.toggle("flip");
}

/* ASCII Rotation */
function asciiFlip(id) {
    document.getElementById(id).classList.toggle("rotate");
}

/* Slide-In für alle Blöcke */
function activateBlocks() {
    document.querySelectorAll('.block').forEach((b, i) => {
        setTimeout(() => b.classList.add('active'), 150 * i);
    });
}

/* TMP + HDF RESPO + NC.link */
(async function () {

    const resolver = window.TMP_HDF_RESOLVER;

    document.getElementById("room81").innerText =
        await fetch("81.room").then(r => r.text());

    document.getElementById("room9").innerText =
        await fetch("9.room").then(r => r.text());

    document.getElementById("commands").innerText =
        await fetch("COMMANDS.room").then(r => r.text());

    document.getElementById("one").innerText =
        await fetch("one.room").then(r => r.text());

    activateBlocks();

})();
</script>

</body>
</html>
