<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>ID · 81.tmp · iki1uc</title>

<style>
body { background:#000; color:#0f0; font-family:Consolas; padding:40px; }
h1 { color:#6cf; letter-spacing:4px; }
.block { background:#111; padding:20px; margin-bottom:20px; border-left:4px solid #6cf; }
pre { background:#000; padding:15px; border-left:3px solid #0f0; }
</style>

<script src="../ANKER/IDneutral.js"></script>
<script src="../ANKER/IDkoop.js"></script>
<script src="../ANKER/IDpook.js"></script>
<script src="./tmp.hdf.resolver.js"></script>

</head>
<body>

<h1>ID · 81.tmp</h1>

<div class="block">
    <h2>Modus</h2>
    <pre id="mode"></pre>
</div>

<div class="block">
    <h2>81.tmp · Status</h2>
    <pre id="status"></pre>
</div>

<script>
(async function () {

    let mode = "neutral";
    if (ID_KOOP?.active) mode = "koop";
    if (ID_POOK?.active) mode = "pook";

    document.getElementById("mode").innerText = mode.toUpperCase();

    const resolver = window.TMP_HDF_RESOLVER;
    const data = await resolver.resolve("81.tmp", "#HDFRESPO");

    document.getElementById("status").innerText =
        JSON.stringify(data, null, 2);

})();
</script>

</body>
</html>
